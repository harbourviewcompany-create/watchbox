name: Refresh Canadian Free Movies
on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-movies-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Update Canadian ad-supported/free catalog
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/update-free-movies.mjs
      - name: Verify site
        run: node tests/smoke.mjs
      - name: Commit refreshed snapshot to main
        run: |
          if git diff --quiet -- data/free-movies.json; then
            echo "Free movie catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/free-movies.json
          git commit -m "data: refresh free movie availability in Canada"
          git push origin HEAD:main
