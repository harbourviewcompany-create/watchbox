<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WatchBox — Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="header">
  <a href="index.html" class="logo">WatchBox</a>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="movies.html">Movies</a>
    <a href="tv.html">TV Shows</a>
  </nav>
  <div class="search-wrap">
    <input type="search" id="search" placeholder="Search titles..." autocomplete="off">
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Inception</h1>
    <p>A thief who steals corporate secrets through dream-sharing technology is given the inverse task of planting an idea into the mind of a CEO.</p>
    <a href="detail.html?id=1" class="btn">▶ Watch Trailer</a>
    <a href="detail.html?id=1" class="btn secondary">More Info</a>
  </div>
</section>

<main>
  <section class="section">
    <h2 class="section-title">Trending Now</h2>
    <div class="row" id="row-trending"></div>
  </section>
  <section class="section">
    <h2 class="section-title">Movies</h2>
    <div class="row" id="row-movies"></div>
  </section>
  <section class="section">
    <h2 class="section-title">TV Shows</h2>
    <div class="row" id="row-tv"></div>
  </section>
  <section class="section">
    <h2 class="section-title">Sci-Fi & Fantasy</h2>
    <div class="row" id="row-scifi"></div>
  </section>
</main>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const trending = content.filter(i => i.trending);
  const movies = content.filter(i => i.type === "movie").slice(0, 12);
  const tv = content.filter(i => i.type === "tv").slice(0, 10);
  const scifi = content.filter(i => i.genres.some(g => ["Sci-Fi", "Fantasy", "Adventure"].includes(g))).slice(0, 12);

  const rows = {
    "row-trending": trending,
    "row-movies": movies,
    "row-tv": tv,
    "row-scifi": scifi
  };

  Object.entries(rows).forEach(([id, items]) => {
    const row = document.getElementById(id);
    items.forEach(item => row.appendChild(createCard(item)));
  });
});
</script>
</body>
</html>
